[package]
name = "mesh-vst"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Seeded sampler instrument for breakbeat drums and mudpie bass"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
mesh-vst-core = { path = "../core" }
nice-plug = { version = "0.4.2", features = ["assert_process_allocs", "standalone"] }
nice-plug-iced = { version = "0.5", features = ["wgpu", "tiny-skia", "canvas"] }
# The shader widget for the visuals.
iced_widget = { version = "0.14.2", features = ["wgpu"] }
bytemuck = { version = "1.21", features = ["derive"] }
realfft = "3.5"
basedrop = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rtrb = "0.3"
dirs = "6"
