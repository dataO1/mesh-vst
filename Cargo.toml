[workspace]
resolver = "2"
members = ["crates/core", "crates/plugin", "crates/hostcheck", "xtask"]

[workspace.package]
version = "0.0.2"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/dataO1/mesh-vst"

[profile.release]
debug = 1

# iced_baseview with file drag and drop forwarded to iced (vendor/iced_baseview, MIT/Apache).
[patch.crates-io]
iced_baseview = { path = "vendor/iced_baseview" }
